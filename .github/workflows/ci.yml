name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted runners ship with Docker, so the Testcontainers-backed
      # integration tests run against a real PostgreSQL 16 container here.
      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  # 테스트가 통과했을 때만 컨테이너 이미지를 만들어 GitHub Container Registry(ghcr.io)에 올린다.
  # 쿠버네티스는 노드에 없는 이미지를 레지스트리에서 받아오므로, 실제 배포는 이 경로를 쓴다.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io 에 push 하기 위한 권한
    steps:
      - uses: actions/checkout@v4

      # ghcr.io 는 소문자 경로만 허용하므로 저장소 이름을 소문자로 변환한다.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 별도 비밀키 없이 워크플로가 발급받는 토큰

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # PR 에서는 빌드만 해보고 올리지 않는다.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
