spring:
  application:
    name: dvp-settlement-simulator
  datasource:
    url: jdbc:postgresql://localhost:5432/dvp
    username: dvp
    password: dvp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.dvp.settlement: DEBUG
