spring:
  application:
    name: dvp-settlement-simulator
  datasource:
    url: jdbc:postgresql://localhost:5432/dvp
    username: dvp
    password: dvp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

# 배포 버전. 컨테이너 환경변수 APP_VERSION 으로 덮어쓴다.
app:
  version: ${APP_VERSION:dev}

# 쿠버네티스가 호출하는 상태 점검 주소
#  - /actuator/health/liveness  : 앱이 살아 있는가 (아니면 파드를 재시작)
#  - /actuator/health/readiness : 요청을 받을 준비가 됐는가 (아니면 트래픽을 보내지 않음)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    com.dvp.settlement: DEBUG
